<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/developer_logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Abhi Labs</title>
  <meta property="og:image" content="https://abhilabs.app/assets/developer_logo.png">
  <meta name="twitter:image" content="https://abhilabs.app/assets/developer_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/styles/output.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<header class="site-header" role="banner">
  <nav class="nav-container" aria-label="Main navigation">
    <a href="/" class="nav-logo" aria-label="Abhi Labs home">
      <span class="nav-logo-mark">AL</span>
      <span class="nav-logo-text">Abhi Labs</span>
    </a>
    <ul class="nav-links" role="list" id="nav-menu">
      <li><a href="/" class="nav-link">Portfolio</a></li>
      <li><a href="/about/" class="nav-link">About</a></li>
      <li><a href="mailto:myabhilabs@gmail.com" class="nav-cta">Contact</a></li>
    </ul>
    <button class="nav-hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </nav>
</header>
<main id="main-content" style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:120px 1.5rem 80px">
  <div>
    <p style="font-size:5rem;font-weight:800;letter-spacing:-0.05em;color:var(--text-3);line-height:1">404</p>
    <h1 style="font-size:1.5rem;font-weight:700;color:var(--text-1);margin:0.5rem 0 0.75rem">Page not found</h1>
    <p style="color:var(--text-2);margin-bottom:2rem">The page you're looking for doesn't exist or was moved.</p>
    <a href="/" class="btn-primary">← Back to Portfolio</a>
  </div>
</main>
<footer class="site-footer" role="contentinfo">
  <div class="footer-container">
    <div class="footer-brand">
      <a href="/" class="nav-logo" aria-label="Abhi Labs home">
        <span class="nav-logo-mark">AL</span>
        <span class="nav-logo-text">Abhi Labs</span>
      </a>
      <p class="footer-tagline">Tomorrow's Tech Today</p>
    </div>
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="/" class="footer-link">Portfolio</a>
      <a href="/about/" class="footer-link">About</a>
    </nav>
    <p class="footer-copy">© 2026 Abhi Labs. Bangalore, India.</p>
  </div>
</footer>
<script>
  const btn = document.querySelector('.nav-hamburger');
  const links = document.querySelector('.nav-links');
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    links.classList.toggle('nav-links--open');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.nav-container')) {
      btn.setAttribute('aria-expanded', 'false');
      links.classList.remove('nav-links--open');
    }
  });
</script>
</body>
</html>
